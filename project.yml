name: Herdwick
options:
  bundleIdPrefix: dev.btuckerc
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 7F3KV9WTNW
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  HerdwickCore:
    path: Packages/HerdwickCore
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.20.0"
targets:
  Herdwick:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: HerdwickCore
        product: HerdrAPI
      - package: HerdwickCore
        product: HerdwickSSH
      - package: HerdwickCore
        product: HerdrDemo
      - package: SwiftTerm
      # Built by scripts/mini/build-tailscalekit.sh; not checked in.
      - framework: Frameworks/TailscaleKit.xcframework
        embed: true
      - target: HerdwickWidgets
      - target: HerdwickNotifications
    entitlements:
      path: App/Herdwick.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.btuckerc.herdwick]
        aps-environment: $(APS_ENVIRONMENT)
    info:
      path: App/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Herdwick connects to herdr on computers on your local network.
        # Background refresh reconnects briefly to raise alerts and update widgets.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [dev.btuckerc.herdwick.refresh]
        # Alerts and widgets open an agent with herdwick://open?host=…&session=…&pane=…
        CFBundleURLTypes:
          - CFBundleURLName: dev.btuckerc.herdwick
            CFBundleURLSchemes: [herdwick]
        # Opt-in alerts while away go through this relay (relay/); it holds the team's APNs key.
        # A build signed by another team needs its own relay here, or an empty string for none.
        HerdwickPushRelay: https://herdwick-push.btuckerc-flare.workers.dev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.btuckerc.herdwick
        TARGETED_DEVICE_FAMILY: "1,2"
        APS_ENVIRONMENT: development
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Herdwick
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        GENERATE_INFOPLIST_FILE: YES
      configs:
        # TestFlight: API-made profiles (scripts/mini/app-store-profiles.mjs), no Xcode account.
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Herdwick App Store
  HerdwickWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    entitlements:
      path: Widgets/HerdwickWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.btuckerc.herdwick]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Herdwick
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.btuckerc.herdwick.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
      configs:
        # TestFlight: API-made profiles (scripts/mini/app-store-profiles.mjs), no Xcode account.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Herdwick Widgets App Store
  HerdwickNotifications:
    type: app-extension
    platform: iOS
    sources:
      - Notifications
      - Shared
    entitlements:
      path: Notifications/HerdwickNotifications.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.btuckerc.herdwick]
    info:
      path: Notifications/Info.plist
      properties:
        CFBundleDisplayName: Herdwick
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.btuckerc.herdwick.notifications
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
      configs:
        # TestFlight: API-made profiles (scripts/mini/app-store-profiles.mjs), no Xcode account.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Herdwick Notifications App Store
