name = "herdwick-push"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Secrets (wrangler secret put): APNS_KEY, APNS_KEY_ID, APNS_TEAM_ID.
[vars]
APNS_TOPIC = "dev.btuckerc.herdwick"

# At most 20 alerts a minute to any one device.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# No request logs: device tokens stay out of Cloudflare's dashboards.
[observability]
enabled = false
